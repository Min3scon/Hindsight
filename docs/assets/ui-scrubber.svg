<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
<title id="t">The Hindsight scrubber</title>
<desc id="d">A 3D viewport with a clay sculpt. Along the bottom runs the scrubber: a round dot that opens the History Menu, the history bar you drag to scrub, the handle marking the current step, a violet tick for the morph target, and the counter 214 / 10000 showing step and step cap. It appears after your first stroke.</desc>
<defs>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.lbl{font-size:21px;font-weight:600;fill:#ecebe7;paint-order:stroke;stroke:#0b0c0f;stroke-width:6px;stroke-linejoin:round}
.note{font-size:18px;fill:#9da2ad}
.ui{font-size:15px;fill:#ecebe7}
.mut{fill:#9da2ad}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.lead{stroke:#9da2ad;stroke-width:1.6;fill:none}
.pin{fill:#ecebe7;stroke:#0b0c0f;stroke-width:2}
.grid{stroke:#1f232c;stroke-width:1;fill:none}
</style>
<linearGradient id="vp" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1b1f27"/><stop offset="1" stop-color="#12151b"/>
</linearGradient>
<radialGradient id="clay" cx="0.38" cy="0.28" r="0.85">
<stop offset="0" stop-color="#f3b78c"/><stop offset="0.45" stop-color="#d4824f"/><stop offset="1" stop-color="#7a3f20"/>
</radialGradient>
<clipPath id="vpc"><rect x="20" y="20" width="760" height="364" rx="14"/></clipPath>
</defs>
<rect width="800" height="500" fill="#0b0c0f"/>
<!-- viewport -->
<rect x="20" y="20" width="760" height="364" rx="14" fill="url(#vp)" stroke="#2a2f3a"/>
<g clip-path="url(#vpc)">
<path class="grid" d="M20 262H780M20 300H780M20 352H780M400 238L400 384M300 238L150 384M200 238L-80 384M500 238L650 384M600 238L880 384"/>
<path d="M20 238H780" stroke="#262b35" stroke-width="1.2"/>
<rect x="20" y="20" width="760" height="38" fill="#1d2129"/>
<path d="M20 58H780" stroke="#2a2f3a"/>
</g>
<!-- header -->
<rect x="34" y="28" width="128" height="22" rx="6" fill="#2a2f3a"/>
<circle cx="48" cy="39" r="5" fill="none" stroke="#ff8a3d" stroke-width="2"/>
<text class="ui" x="60" y="44">Sculpt Mode</text>
<g fill="#2a2f3a"><rect x="174" y="28" width="22" height="22" rx="5"/><rect x="200" y="28" width="22" height="22" rx="5"/><rect x="226" y="28" width="22" height="22" rx="5"/><rect x="680" y="28" width="22" height="22" rx="5"/><rect x="706" y="28" width="22" height="22" rx="5"/><rect x="732" y="28" width="34" height="22" rx="5"/></g>
<circle cx="691" cy="39" r="5" fill="#9da2ad"/><circle cx="717" cy="39" r="5" fill="none" stroke="#9da2ad" stroke-width="1.6"/>
<!-- sculpt -->
<g transform="translate(400 185) scale(0.92) translate(-400 -185)">
<ellipse cx="402" cy="280" rx="170" ry="10" fill="#000" opacity="0.35"/>
<path fill="url(#clay)" d="M420 90C468 90 494 124 492 166C490 196 476 214 464 226L466 240C506 248 544 260 560 280L240 280C256 260 300 248 368 240L372 222C360 220 352 214 350 204C348 198 352 194 348 190C344 186 348 182 344 178C340 174 330 168 332 162C334 156 344 150 348 140C350 134 344 128 348 120C354 100 380 90 420 90Z"/>
<ellipse cx="444" cy="170" rx="11" ry="17" fill="none" stroke="#7a3f20" stroke-width="3" opacity="0.7"/>
<g fill="none" stroke="#f9d2b4" stroke-linecap="round" opacity="0.45" stroke-width="3">
<path d="M380 112C404 104 436 106 458 122"/><path d="M392 136C412 130 440 134 462 150"/><path d="M290 266C330 252 380 246 420 248"/>
</g>
<path d="M466 240C506 248 544 260 560 280" fill="none" stroke="#f3b78c" stroke-width="2" opacity="0.5"/>
</g>
<circle cx="478" cy="128" r="24" fill="none" stroke="#ecebe7" stroke-width="1.6" opacity="0.75"/><circle cx="478" cy="128" r="2" fill="#ecebe7" opacity="0.75"/>
<!-- corner note -->
<g>
<circle cx="610" cy="88" r="9" fill="none" stroke="#5fd0ff" stroke-width="1.8"/>
<path d="M610 84v1M610 87.5v5" stroke="#5fd0ff" stroke-width="2" stroke-linecap="round"/>
<text class="note" x="764" y="94" text-anchor="end">Appears after</text>
<text class="note" x="764" y="117" text-anchor="end">your first stroke</text>
</g>
<!-- scrubber -->
<rect x="160" y="341" width="440" height="10" rx="5" fill="#0b0c0f" fill-opacity="0.6" stroke="#2a2f3a"/>
<rect x="160" y="341" width="310" height="10" rx="5" fill="#ff993d"/>
<rect x="298.5" y="333" width="4" height="26" rx="1.5" fill="#b391ff"/>
<circle cx="136" cy="346" r="10" fill="#ff993d"/>
<rect x="463" y="333" width="14" height="26" rx="4" fill="#ffd1ad" stroke="#0b0c0f" stroke-width="2"/>
<rect x="614" y="333" width="122" height="26" rx="6" fill="#0b0c0f" fill-opacity="0.55"/>
<text class="mono" x="675" y="352" text-anchor="middle" font-size="17" fill="#ecebe7">214 / 10000</text>
<!-- callouts above -->
<path class="lead" d="M300 308V329"/><circle class="pin" cx="300" cy="329" r="4"/>
<text class="lbl" x="300" y="300" text-anchor="middle">Morph target</text>
<path class="lead" d="M470 308V329"/><circle class="pin" cx="470" cy="329" r="4"/>
<text class="lbl" x="470" y="300" text-anchor="middle">Current step</text>
<!-- callouts below -->
<path class="lead" d="M136 360V406"/><circle class="pin" cx="136" cy="360" r="4"/>
<text class="lbl" x="36" y="430">Opens the History Menu</text>
<path class="lead" d="M400 355V448"/><circle class="pin" cx="400" cy="355" r="4"/>
<text class="lbl" x="400" y="474" text-anchor="middle">Your history (drag to scrub)</text>
<path class="lead" d="M675 363V406"/><circle class="pin" cx="675" cy="363" r="4"/>
<text class="lbl" x="764" y="430" text-anchor="end">Step / step cap</text>
</svg>
