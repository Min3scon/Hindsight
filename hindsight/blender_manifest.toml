schema_version = "1.0.0"

id = "hindsight"
version = "1.0.0-beta.2"
name = "Hindsight"
tagline = "Scrubbable history for sculpting, objects and Edit Mode (beta)"
maintainer = "Min3scon"
type = "add-on"
website = "https://min3scon.github.io/Hindsight/"
tags = ["Sculpt", "Paint", "Mesh"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Min3scon"]
# The native engine (native/ at the repository root): Blender installs the wheel that matches the
# platform; anywhere else the add-on uses its Python code (same results).
wheels = [
  "./wheels/hindsight_native-0.5.1-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/hindsight_native-0.5.1-cp311-abi3-win_amd64.whl",
  "./wheels/hindsight_native-0.5.1-cp311-abi3-macosx_11_0_arm64.whl",
  "./wheels/hindsight_native-0.5.1-cp311-abi3-macosx_10_12_x86_64.whl",
  "./wheels/hindsight_native-0.5.1-cp311-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
  "./wheels/hindsight_native-0.5.1-cp311-abi3-win_arm64.whl",
]

[permissions]
files = "Save sculpt history next to the blend file and in user data"

[build]
paths_exclude_pattern = ["__pycache__/", ".*", "*.pyc", "/tests/"]
