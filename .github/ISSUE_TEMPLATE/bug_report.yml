name: Bug report
description: Something in Hindsight doesn't work the way the docs say
title: "[Bug] "
labels: ["bug", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the beta. The quickest way to a fix: in Blender, open the Undo History tab (press N), open Help, click Copy diagnostics, and paste the text below.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Undo History tab > Help > Copy diagnostics. It has versions, settings and recent log lines, with file paths removed.
      render: text
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version
      placeholder: "5.1.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: hindsight
    attributes:
      label: Hindsight version
      description: The first line of the diagnostics, or Edit > Preferences > Add-ons.
      placeholder: "1.0.0-beta.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      placeholder: |
        1. Opened a file with a 200k mesh
        2. Made 3 strokes in Sculpt Mode
        3. Dragged the slider back to step 1
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
      description: Error text from Window > Toggle System Console (Windows) or the terminal helps a lot.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mesh size, Multires or Dyntopo, modifiers, a screenshot, or a small .blend if you can share one.
