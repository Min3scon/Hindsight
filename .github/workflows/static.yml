# Deploys the website (docs/) to GitHub Pages.
# Every run rebuilds docs/download/hindsight.zip and the site from source, runs the core tests and the
# copy check, and only publishes if all of them pass. Runs on pushes to the default branch, on v* tags
# and manually from the Actions tab.
name: Deploy static content to Pages

on:
  push:
    branches: ["claude/lucid-brahmagupta-9gsdsn"]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are skipped, in-progress runs are not cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core tests (no Blender needed)
        run: |
          python -m pip install --quiet numpy zstandard==0.23.0
          for t in tests/test_core_*.py tests/test_tools_*.py; do HINDSIGHT_VERIFY=1 python "$t" || exit 1; done
      - name: Check the download zip
        # docs/download/hindsight.zip is built with real Blender (tests_ui/hs_ui.py build) and
        # install-tested before it is committed; publish that exact file, never a rebuild.
        run: |
          python3 - <<'PY'
          import json, tomllib, zipfile
          src = tomllib.load(open("hindsight/blender_manifest.toml", "rb"))["version"]
          with zipfile.ZipFile("docs/download/hindsight.zip") as z:
              packed = tomllib.loads(z.read("blender_manifest.toml").decode("utf-8"))["version"]
              info = json.loads(z.read("build_info.json"))
          assert packed == src == info["version"], (packed, src, info)
          print("OK docs/download/hindsight.zip", packed, info["source_commit"])
          PY
      - name: Build the site
        run: python3 site/build.py
      - name: Copy check (STYLE.md rules)
        run: python3 tools/check_copy.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
