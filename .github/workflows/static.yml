# Deploys the website (docs/) to GitHub Pages.
# Rebuilds docs/download/hindsight.zip and the version/size text first, so the site always offers the
# newest build. Runs on every push to the default branch, on v* tags and manually from the Actions tab.
name: Deploy static content to Pages

on:
  push:
    branches: ["claude/lucid-brahmagupta-9gsdsn"]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are skipped, in-progress runs are not cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build download zip and update version/size text
        run: python3 scripts/build_zip.py --blender-ext ""
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the website folder is published (served at https://min3scon.github.io/Hindsight/)
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
